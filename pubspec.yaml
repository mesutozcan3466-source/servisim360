name: servisim360
description: "Servis360 - Akilli Servis Yonetim Sistemi"
publish_to: 'none'
version: 1.0.0+1

environment:
    sdk: '>=3.0.5 <4.0.0'

dependencies:
    flutter:
        sdk: flutter

    # ── Firebase (tum platformlar) ────────────────────────────────────────
    firebase_core: ^3.6.0
    firebase_auth: ^5.3.1
    cloud_firestore: ^5.4.4
    firebase_storage: ^12.3.2
    firebase_messaging: ^15.1.3
    cloud_functions: ^5.1.3
    firebase_remote_config: ^5.1.5
    firebase_crashlytics: ^4.1.3

    # ── Harita & Konum (web + mobil destekli) ────────────────────────────
    google_maps_flutter: ^2.9.0
    google_maps_flutter_web: ^0.5.10
    geolocator: ^13.0.0
    geocoding: ^3.0.0

    # ── HTTP ──────────────────────────────────────────────────────────────
    http: ^1.2.0

    # ── Cihaz & Sistem (web + mobil) ─────────────────────────────────────
    device_info_plus: ^10.0.0
    package_info_plus: ^8.0.0
    url_launcher: ^6.3.0
    shared_preferences: ^2.3.2
    app_links: ^6.3.2

    # ── Dosya & PDF (web + mobil) ─────────────────────────────────────────
    file_picker: ^8.1.6
    pdf: ^3.12.0
    printing: ^5.14.3
    path_provider: ^2.1.0
    image_picker: ^1.1.2

    # ── QR Kod ────────────────────────────────────────────────────────────
    qr_flutter: ^4.1.0

    # ── Ses ───────────────────────────────────────────────────────────────
    flutter_tts: ^4.0.2
    speech_to_text: ^7.4.0

    # ── Grafik & UI ───────────────────────────────────────────────────────
    fl_chart: ^1.2.0
    excel: ^4.0.6

    # ── UI ────────────────────────────────────────────────────────────────
    cupertino_icons: ^1.0.8
    provider: ^6.1.5
    flutter_launcher_icons: ^0.14.4
    intl: ^0.20.2
    flutter_local_notifications: ^18.0.0

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^5.0.0

flutter_launcher_icons:
    android: true
    ios: true
    web:
        generate: true
        image_path: "assets/logo_app.png"
        background_color: "#1a3a6b"
        theme_color: "#1a3a6b"
    image_path: "assets/logo_app.png"
    adaptive_icon_background: "#1a3a6b"
    adaptive_icon_foreground: "assets/logo_app.png"
    min_sdk_android: 21

flutter:
    uses-material-design: true
    assets:
        - assets/logo_app.png
