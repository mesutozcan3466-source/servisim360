<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Servisim360 - Akilli Servis Yonetim Sistemi">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Servisim360">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Servisim360</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Maps Web için zorunlu -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAyPvU0fP3lpqCqWuB29jl6ScVZXFFKOgU"></script>

  <!-- Flutter web yüklenene kadar loading ekranı -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1a3a6b;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
    }
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    #loading img {
      width: 80px;
      height: 80px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    #loading p {
      color: #FF8C00;
      font-size: 16px;
      letter-spacing: 1px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,140,0,0.3);
      border-top-color: #FF8C00;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(0.95); }
    }
  </style>
</head>
<body>

<!-- Uygulama yüklenene kadar gösterilen ekran -->
<div id="loading">
  <div class="spinner"></div>
  <p>Servisim360 yükleniyor...</p>
</div>

<script>
  // Flutter yüklenince loading ekranını gizle
  window.addEventListener('flutter-first-frame', function () {
    var loading = document.getElementById('loading');
    if (loading) loading.style.display = 'none';
  });
</script>

<script src="flutter_bootstrap.js" async></script>
</body>
</html>
