<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Servis360 - Akilli Servis Yonetimi">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Servis360">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <!-- Favicon - Servis360 Logosu -->
  <link rel="icon" type="image/png" href="icons/Icon-32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="icons/Icon-192.png" sizes="192x192">
  <link rel="shortcut icon" href="favicon.png">
  <title>Servis360 - Akilli Servis Yonetimi</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { background-color: #1a3a6b; }
    /* Loading splash */
    #splash {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: #1a3a6b;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    #splash img { width: 160px; height: 160px; border-radius: 24px; }
    #splash h1 {
      color: white; font-family: sans-serif;
      font-size: 28px; font-weight: bold;
      margin: 16px 0 4px;
    }
    #splash p {
      color: #FF8C00; font-family: sans-serif;
      font-size: 14px; margin: 0;
    }
  </style>
</head>
<body>
  <!-- Web Splash Screen -->
  <div id="splash">
    <img src="icons/Icon-512.png" alt="Servis360 Logo">
    <h1>Servis<span style="color:#FF8C00">360</span></h1>
    <p>Akilli Servis Yonetimi</p>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function() { splash.style.display = 'none'; }, 500);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
